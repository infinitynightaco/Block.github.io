<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Blast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="header">
      <h1>Block Blast</h1>
      <div id="score-container">
        <span id="score-label">Score</span>
        <span id="score">0</span>
        <span id="combo-label" style="display:none">Combo <span id="combo-count">0</span></span>
        <span id="high-label">Best <span id="high-score">0</span></span>
      </div>
    </div>

    <div id="board-container">
      <canvas id="board" width="320" height="320"></canvas>
      <div id="combo-display"></div>
      <div id="game-over-overlay">
        <h2>Game Over</h2>
        <p>Score: <span id="final-score">0</span></p>
        <button id="restart-btn">Play Again</button>
      </div>
    </div>

    <div id="pieces-container">
      <div id="pieces-label">Next Blocks</div>
      <div id="pieces"></div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
